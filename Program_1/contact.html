<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Online Book Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- Header -->
  <header class="bg-white border-bottom p-3 text-center">
    <h2 class="text-primary">Online Book Store</h2>

    <nav class="nav justify-content-center">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link" href="catalog.html">Catalog</a>
      <a class="nav-link active" href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Contact Form -->
  <main class="container mt-4">
    <h4>Contact Us</h4>

    <form class="card p-3">
      <div class="mb-3">
        <label>Name</label>
        <input type="text" class="form-control">
      </div>

      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control">
      </div>

      <div class="mb-3">
        <label>Message</label>
        <textarea class="form-control" rows="3"></textarea>
      </div>

      <button class="btn btn-primary">Send</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="text-center p-2 bg-white border-top mt-5">
    © 2026 Online Book Store
  </footer>

</body>
</html>
