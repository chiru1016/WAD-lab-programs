<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catalog - Online Book Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- Header -->
  <header class="bg-white border-bottom p-3 text-center">
    <h2 class="text-primary">Online Book Store</h2>

    <nav class="nav justify-content-center">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="profile.html">Profile</a>
      <a class="nav-link active" href="catalog.html">Catalog</a>
      <a class="nav-link" href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Catalog -->
  <main class="container mt-4">
    <h4 class="mb-3">Book Catalog</h4>

    <div class="row">

      <!-- Book 1 -->
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <img src="images/image1.jpg" class="img-fluid mb-2" alt="Book">
          <h6>Summer Girl</h6>
          <p>Rs. 500</p>
          <button class="btn btn-primary">View</button>
        </div>
      </div>

      <!-- Book 2 -->
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <img src="images/image2.jpg" class="img-fluid mb-2" alt="Book">
          <h6>Winter Boy</h6>
          <p>Rs. 500</p>
          <button class="btn btn-primary">View</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center p-2 bg-white border-top mt-5">
    © 2026 Online Book Store
  </footer>

</body>
</html>
